<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Anand Teja Dasari, aspiring Java full stack developer and AI and Data Science undergraduate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Anand Teja Dasari — Java full stack developer, AI &amp; Data Science undergraduate</title>
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F16"/>
      <stop offset="0.55" stop-color="#0D131C"/>
      <stop offset="1" stop-color="#0A0F16"/>
    </linearGradient>
    <pattern id="h-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#151D28" stroke-width="1"/>
    </pattern>
    <linearGradient id="h-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B9CF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5B9CF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5B9CF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A33D"/>
      <stop offset="0.45" stop-color="#9B7BF0"/>
      <stop offset="1" stop-color="#3FBFD4"/>
    </linearGradient>
    <clipPath id="h-clip"><rect x="0" y="0" width="1200" height="380" rx="16"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .caret { animation: blink 1.15s steps(1, end) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }
    .sweep { animation: slide 9s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes slide { 0% { transform: translateX(-460px) } 60%, 100% { transform: translateX(1280px) } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
    @media (prefers-reduced-motion: reduce) {
      .caret, .sweep, .pulse { animation: none }
    }
  </style>

  <g clip-path="url(#h-clip)">
    <rect width="1200" height="380" fill="url(#h-bg)"/>
    <rect width="1200" height="380" fill="url(#h-grid)" opacity="0.55"/>
    <rect class="sweep" x="0" y="0" width="420" height="380" fill="url(#h-sweep)" opacity="0.30"/>

    <!-- window chrome -->
    <rect x="0" y="0" width="1200" height="46" fill="#0C121A"/>
    <line x1="0" y1="46" x2="1200" y2="46" stroke="#1B2431" stroke-width="1"/>
    <circle cx="28" cy="23" r="5" fill="#E8A33D" opacity="0.75"/>
    <circle cx="46" cy="23" r="5" fill="#9B7BF0" opacity="0.75"/>
    <circle cx="64" cy="23" r="5" fill="#3FBFD4" opacity="0.75"/>
    <text class="mono" x="92" y="28" font-size="13" fill="#5D6B7A">anandteja2030 — profile</text>
    <circle class="pulse" cx="1010" cy="23" r="4" fill="#4ADE80"/>
    <text class="mono" x="1024" y="28" font-size="13" fill="#94A3B2">open to entry-level roles</text>

    <!-- name -->
    <text class="sans" x="56" y="148" font-size="56" font-weight="700" letter-spacing="-1.2" fill="#E3EAF2">Anand Teja Dasari</text>
    <rect x="58" y="166" width="132" height="3" rx="1.5" fill="url(#h-rule)"/>

    <text class="mono" x="58" y="196" font-size="15.5" fill="#94A3B2">aspiring Java full stack developer, AI &amp; Data Science undergraduate</text>
    <rect class="caret" x="614" y="184" width="9" height="16" fill="#3FBFD4"/>

    <!-- identity chips -->
    <g>
      <rect x="56" y="230" width="74" height="30" rx="6" fill="#1A1408" stroke="#E8A33D" stroke-opacity="0.45"/>
      <text class="mono" x="93" y="250" font-size="12.5" letter-spacing="1.4" text-anchor="middle" fill="#E8A33D">JAVA</text>
      <text class="mono" x="146" y="251" font-size="14" text-anchor="middle" fill="#3C4A59">×</text>

      <rect x="162" y="230" width="52" height="30" rx="6" fill="#140F22" stroke="#9B7BF0" stroke-opacity="0.45"/>
      <text class="mono" x="188" y="250" font-size="12.5" letter-spacing="1.4" text-anchor="middle" fill="#9B7BF0">AI</text>
      <text class="mono" x="230" y="251" font-size="14" text-anchor="middle" fill="#3C4A59">×</text>

      <rect x="246" y="230" width="124" height="30" rx="6" fill="#08191C" stroke="#3FBFD4" stroke-opacity="0.45"/>
      <text class="mono" x="308" y="250" font-size="12.5" letter-spacing="1.4" text-anchor="middle" fill="#3FBFD4">FULL STACK</text>
      <text class="mono" x="386" y="251" font-size="14" text-anchor="middle" fill="#3C4A59">×</text>

      <rect x="402" y="230" width="176" height="30" rx="6" fill="#0A1322" stroke="#5B9CF8" stroke-opacity="0.45"/>
      <text class="mono" x="490" y="250" font-size="12.5" letter-spacing="1.4" text-anchor="middle" fill="#5B9CF8">PROBLEM SOLVING</text>
    </g>

    <!-- stat strip -->
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#1B2431" stroke-width="1"/>
    <rect x="0" y="301" width="1200" height="79" fill="#0B1119"/>

    <text class="sans" x="56" y="340" font-size="26" font-weight="600" fill="#E3EAF2">8.87<tspan font-size="15" fill="#5D6B7A"> / 10</tspan></text>
    <text class="mono" x="56" y="360" font-size="11.5" letter-spacing="0.8" fill="#5D6B7A">CGPA, B.Tech AI &amp; DS</text>

    <line x1="330" y1="318" x2="330" y2="358" stroke="#1B2431"/>
    <text class="sans" x="370" y="340" font-size="26" font-weight="600" fill="#E3EAF2">94.42<tspan font-size="15" fill="#5D6B7A">%</tspan></text>
    <text class="mono" x="370" y="360" font-size="11.5" letter-spacing="0.8" fill="#5D6B7A">model accuracy, fake-review detector</text>

    <line x1="760" y1="318" x2="760" y2="358" stroke="#1B2431"/>
    <text class="sans" x="800" y="340" font-size="26" font-weight="600" fill="#E3EAF2">2</text>
    <text class="mono" x="800" y="360" font-size="11.5" letter-spacing="0.8" fill="#5D6B7A">internships, AI and MERN</text>

    <line x1="1030" y1="318" x2="1030" y2="358" stroke="#1B2431"/>
    <text class="sans" x="1070" y="340" font-size="26" font-weight="600" fill="#E3EAF2">5</text>
    <text class="mono" x="1070" y="360" font-size="11.5" letter-spacing="0.8" fill="#5D6B7A">algorithms visualized</text>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="16" fill="none" stroke="#1F2937"/>
