<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="212" viewBox="0 0 1200 212" role="img" aria-label="Open to entry-level Java full stack and software engineering roles; contact details" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Open to entry-level Java full stack and software engineering roles</title>
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F16"/>
      <stop offset="1" stop-color="#0D131C"/>
    </linearGradient>
    <pattern id="f-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141C26" stroke-width="1"/>
    </pattern>
    <linearGradient id="f-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A33D"/>
      <stop offset="0.5" stop-color="#9B7BF0"/>
      <stop offset="1" stop-color="#3FBFD4"/>
    </linearGradient>
    <clipPath id="f-clip"><rect x="0" y="0" width="1200" height="212" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none } }
  </style>

  <g clip-path="url(#f-clip)">
    <rect width="1200" height="212" fill="url(#f-bg)"/>
    <rect width="1200" height="212" fill="url(#f-grid)" opacity="0.5"/>
    <rect x="40" y="0" width="140" height="3" rx="1.5" fill="url(#f-rule)"/>

    <circle class="dot" cx="46" cy="52" r="4.5" fill="#4ADE80"/>
    <text class="mono" x="60" y="56" font-size="12" letter-spacing="1.2" fill="#4ADE80">AVAILABLE</text>

    <text class="sans" x="40" y="100" font-size="22" font-weight="600" fill="#E3EAF2">Open to entry-level Java full stack and software engineering roles</text>
    <text class="mono" x="40" y="130" font-size="13" fill="#8798A8">Happy to talk about Java, full-stack work, or applied machine learning.</text>

    <line x1="40" y1="156" x2="1160" y2="156" stroke="#1B2431"/>
    <text class="mono" x="40" y="184" font-size="12.5" fill="#5D6B7A">github.com/anandteja2030</text>
    <text class="mono" x="320" y="184" font-size="12.5" fill="#5D6B7A">linkedin.com/in/anandteja2030</text>
    <text class="mono" x="640" y="184" font-size="12.5" fill="#5D6B7A">anandtejadasari52@gmail.com</text>

    <rect x="0.5" y="0.5" width="1199" height="211" rx="16" fill="none" stroke="#1F2937"/>
  </g>
