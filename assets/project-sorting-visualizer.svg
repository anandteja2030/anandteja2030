<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="404" viewBox="0 0 1200 404" role="img" aria-label="Interactive sorting algorithm visualizer with five algorithms and four controls" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Interactive sorting algorithm visualizer</title>
  <defs>
    <pattern id="p2-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141C26" stroke-width="1"/>
    </pattern>
    <clipPath id="p2-clip"><rect x="0" y="0" width="1200" height="404" rx="16"/></clipPath>
    <linearGradient id="p2-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8A33D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .scan { animation: scan 5.5s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes scan { 0% { transform: translateX(0) } 100% { transform: translateX(600px) } }
    .cmp { animation: cmp 5.5s ease-in-out infinite; }
    @keyframes cmp { 0%, 55% { fill: #2B3A4C } 62%, 78% { fill: #E8A33D } 85%, 100% { fill: #2B3A4C } }
    @media (prefers-reduced-motion: reduce) { .scan, .cmp { animation: none } }
  </style>

  <g clip-path="url(#p2-clip)">
    <rect width="1200" height="404" fill="#0A0F16"/>
    <rect width="1200" height="404" fill="url(#p2-grid)" opacity="0.5"/>

    <text class="mono" x="40" y="44" font-size="12" letter-spacing="1.4" fill="#3FBFD4">PROJECT</text>
    <text class="sans" x="40" y="76" font-size="23" font-weight="600" fill="#E3EAF2">Interactive sorting algorithm visualizer</text>
    <text class="mono" x="40" y="100" font-size="12.5" fill="#5D6B7A">animated, step-by-step comparison and swap visualization, September 2025</text>
    <line x1="40" y1="118" x2="1160" y2="118" stroke="#1B2431"/>

    <rect x="40" y="140" width="660" height="228" rx="10" fill="#0C121A" stroke="#1B2431"/>
    <text class="mono" x="60" y="166" font-size="11.5" fill="#4E5B69">pass in progress — sorted prefix on the left, unsorted tail on the right</text>
      <rect x="48" y="302" width="18" height="28" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="74" y="290" width="18" height="40" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="100" y="278" width="18" height="52" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="126" y="266" width="18" height="64" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="152" y="254" width="18" height="76" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="178" y="242" width="18" height="88" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="204" y="230" width="18" height="100" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="230" y="218" width="18" height="112" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="256" y="206" width="18" height="124" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="282" y="194" width="18" height="136" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="308" y="182" width="18" height="148" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect x="334" y="170" width="18" height="160" rx="3" fill="#3FBFD4" opacity="0.85"/>
      <rect class="cmp" x="360" y="238" width="18" height="92" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect class="cmp" x="386" y="120" width="18" height="210" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect x="412" y="264" width="18" height="66" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect x="438" y="152" width="18" height="178" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect x="464" y="210" width="18" height="120" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect x="490" y="92" width="18" height="238" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect x="516" y="246" width="18" height="84" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect x="542" y="134" width="18" height="196" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect x="568" y="180" width="18" height="150" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect x="594" y="222" width="18" height="108" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect x="620" y="106" width="18" height="224" rx="3" fill="#2B3A4C" opacity="1"/>
      <rect x="646" y="160" width="18" height="170" rx="3" fill="#2B3A4C" opacity="1"/>
    <line x1="48" y1="332" x2="672" y2="332" stroke="#243043"/>
    <g class="scan"><rect x="40" y="150" width="60" height="180" fill="url(#p2-scan)"/></g>

    <rect x="730" y="140" width="430" height="228" rx="10" fill="#0C121A" stroke="#1B2431"/>
    <rect x="730" y="140" width="430" height="3" rx="1.5" fill="#3FBFD4"/>
    <text class="mono" x="754" y="174" font-size="11.5" letter-spacing="1.2" fill="#3FBFD4">5 ALGORITHMS</text>
    <g class="mono" font-size="13" fill="#C6D2DE">
      <text x="754" y="202">Bubble</text>
      <text x="850" y="202">Selection</text>
      <text x="972" y="202">Insertion</text>
      <text x="754" y="228">Merge</text>
      <text x="850" y="228">Quick</text>
    </g>
    <line x1="754" y1="252" x2="1136" y2="252" stroke="#1B2431"/>
    <text class="mono" x="754" y="280" font-size="11.5" letter-spacing="1.2" fill="#E8A33D">4 CONTROLS</text>
    <g class="mono" font-size="13" fill="#C6D2DE">
      <text x="754" y="308">Custom array input</text>
      <text x="960" y="308">Random array</text>
      <text x="754" y="334">Animation speed</text>
      <text x="960" y="334">Run statistics</text>
    </g>

    <text class="mono" x="40" y="390" font-size="11.5" fill="#4E5B69">HTML5 · CSS3 · JavaScript — responsive layout, no framework</text>

    <rect x="0.5" y="0.5" width="1199" height="403" rx="16" fill="none" stroke="#1F2937"/>
  </g>
</svg>
