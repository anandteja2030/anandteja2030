<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Explainable fake review detection pipeline: 8000 reviews, four feature categories, three model stacking ensemble, Streamlit dashboard, 94.42 percent accuracy and 94.58 percent F1 score" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Explainable fake review detection — system pipeline</title>
  <defs>
    <pattern id="p1-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141C26" stroke-width="1"/>
    </pattern>
    <clipPath id="p1-clip"><rect x="0" y="0" width="1200" height="430" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .flow { animation: flow 6s linear infinite; }
    @keyframes flow { 0% { transform: translateX(0) } 100% { transform: translateX(1120px) } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none } }
  </style>

  <g clip-path="url(#p1-clip)">
    <rect width="1200" height="430" fill="#0A0F16"/>
    <rect width="1200" height="430" fill="url(#p1-grid)" opacity="0.5"/>

    <text class="mono" x="40" y="44" font-size="12" letter-spacing="1.4" fill="#9B7BF0">FEATURED PROJECT</text>
    <text class="sans" x="40" y="76" font-size="23" font-weight="600" fill="#E3EAF2">Explainable fake review detection</text>
    <text class="mono" x="40" y="100" font-size="12.5" fill="#5D6B7A">hybrid NLP and stacking ensemble learning, June 2025</text>
    <line x1="40" y1="118" x2="1160" y2="118" stroke="#1B2431"/>

    <!-- flow line + pulse (drawn under the stage cards) -->
    <line x1="40" y1="202" x2="1160" y2="202" stroke="#243043" stroke-width="1.5"/>
    <g class="flow"><circle cx="40" cy="202" r="4.5" fill="#3FBFD4"/></g>

    <!-- stage 1 -->
    <g>
      <rect x="40" y="142" width="246" height="126" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="40" y="142" width="3" height="126" rx="1.5" fill="#3FBFD4"/>
      <text class="mono" x="60" y="170" font-size="11.5" letter-spacing="1.2" fill="#3FBFD4">01 — DATASET</text>
      <text class="sans" x="60" y="200" font-size="15.5" font-weight="600" fill="#E3EAF2">8,000 labeled reviews</text>
      <text class="mono" x="60" y="226" font-size="12" fill="#94A3B2">50% fake</text>
      <text class="mono" x="60" y="246" font-size="12" fill="#94A3B2">50% genuine</text>
    </g>

    <!-- stage 2 -->
    <g>
      <rect x="326" y="142" width="246" height="126" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="326" y="142" width="3" height="126" rx="1.5" fill="#9B7BF0"/>
      <text class="mono" x="346" y="170" font-size="11.5" letter-spacing="1.2" fill="#9B7BF0">02 — FEATURES</text>
      <text class="sans" x="346" y="200" font-size="15.5" font-weight="600" fill="#E3EAF2">4 feature categories</text>
      <text class="mono" x="346" y="226" font-size="12" fill="#94A3B2">TF-IDF, Sentence-BERT</text>
      <text class="mono" x="346" y="246" font-size="12" fill="#94A3B2">sentiment, linguistic</text>
    </g>

    <!-- stage 3 -->
    <g>
      <rect x="612" y="142" width="246" height="126" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="612" y="142" width="3" height="126" rx="1.5" fill="#E8A33D"/>
      <text class="mono" x="632" y="170" font-size="11.5" letter-spacing="1.2" fill="#E8A33D">03 — ENSEMBLE</text>
      <text class="sans" x="632" y="200" font-size="15.5" font-weight="600" fill="#E3EAF2">3-model stacking</text>
      <text class="mono" x="632" y="226" font-size="12" fill="#94A3B2">Logistic Regression</text>
      <text class="mono" x="632" y="246" font-size="12" fill="#94A3B2">XGBoost, LightGBM</text>
    </g>

    <!-- stage 4 -->
    <g>
      <rect x="898" y="142" width="262" height="126" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="898" y="142" width="3" height="126" rx="1.5" fill="#5B9CF8"/>
      <text class="mono" x="918" y="170" font-size="11.5" letter-spacing="1.2" fill="#5B9CF8">04 — INTERFACE</text>
      <text class="sans" x="918" y="200" font-size="15.5" font-weight="600" fill="#E3EAF2">Streamlit dashboard</text>
      <text class="mono" x="918" y="226" font-size="12" fill="#94A3B2">trust score, fake probability</text>
      <text class="mono" x="918" y="246" font-size="12" fill="#94A3B2">per-review explanation</text>
    </g>

    <!-- connector chevrons -->
    <g fill="none" stroke="#3C4A59" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M299 196l7 6-7 6"/>
      <path d="M585 196l7 6-7 6"/>
      <path d="M871 196l7 6-7 6"/>
    </g>

    <!-- results -->
    <line x1="40" y1="300" x2="1160" y2="300" stroke="#1B2431"/>
    <text class="sans" x="40" y="348" font-size="30" font-weight="600" fill="#E3EAF2">94.42<tspan font-size="17" fill="#5D6B7A">%</tspan></text>
    <text class="mono" x="40" y="370" font-size="11.5" fill="#5D6B7A">accuracy</text>

    <line x1="240" y1="322" x2="240" y2="368" stroke="#1B2431"/>
    <text class="sans" x="280" y="348" font-size="30" font-weight="600" fill="#E3EAF2">94.58<tspan font-size="17" fill="#5D6B7A">%</tspan></text>
    <text class="mono" x="280" y="370" font-size="11.5" fill="#5D6B7A">F1 score</text>

    <line x1="480" y1="322" x2="480" y2="368" stroke="#1B2431"/>
    <text class="sans" x="520" y="348" font-size="30" font-weight="600" fill="#E3EAF2">8,000</text>
    <text class="mono" x="520" y="370" font-size="11.5" fill="#5D6B7A">reviews trained on</text>

    <line x1="720" y1="322" x2="720" y2="368" stroke="#1B2431"/>
    <text class="sans" x="760" y="348" font-size="30" font-weight="600" fill="#E3EAF2">3</text>
    <text class="mono" x="760" y="370" font-size="11.5" fill="#5D6B7A">base models stacked</text>

    <g class="mono" font-size="11.5" fill="#4E5B69">
      <text x="920" y="340">Python · Streamlit · Scikit-learn</text>
      <text x="920" y="362">XGBoost · LightGBM · Pandas</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="429" rx="16" fill="none" stroke="#1F2937"/>
  </g>
</svg>
