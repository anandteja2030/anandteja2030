<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="348" viewBox="0 0 1200 348" role="img" aria-label="Timeline of education, internships and certifications from 2023 to 2027" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Education, internships and certifications, 2023 to 2027</title>
  <defs>
    <pattern id="t-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141C26" stroke-width="1"/>
    </pattern>
    <clipPath id="t-clip"><rect x="0" y="0" width="1200" height="348" rx="16"/></clipPath>
    <linearGradient id="t-axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B2431"/>
      <stop offset="0.12" stop-color="#3FBFD4"/>
      <stop offset="0.55" stop-color="#9B7BF0"/>
      <stop offset="0.9" stop-color="#E8A33D"/>
      <stop offset="1" stop-color="#1B2431"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .d { font-size: 11.5px; fill: #5D6B7A; }
    .t { font-size: 13.5px; font-weight: 600; fill: #D3DDE8; }
  </style>

  <g clip-path="url(#t-clip)">
    <rect width="1200" height="348" fill="#0A0F16"/>
    <rect width="1200" height="348" fill="url(#t-grid)" opacity="0.5"/>

    <text class="sans" x="40" y="48" font-size="19" font-weight="600" fill="#E3EAF2">Track record</text>
    <text class="mono" x="40" y="72" font-size="12.5" fill="#5D6B7A">B.Tech in Artificial Intelligence &amp; Data Science, Lakireddy Bali Reddy College of Engineering — CGPA 8.87/10</text>
    <line x1="40" y1="92" x2="1160" y2="92" stroke="#1B2431"/>

    <!-- axis -->
    <rect x="40" y="209" width="1120" height="2" fill="url(#t-axis)"/>
    <text class="mono" x="40" y="200" font-size="11" fill="#3C4A59">2023</text>
    <text class="mono" x="1160" y="200" font-size="11" text-anchor="end" fill="#3C4A59">2027</text>

    <!-- nodes: cyan = education, amber = internship, violet = certification -->
    <g stroke="#243043" stroke-width="1">
      <line x1="90" y1="209" x2="90" y2="186"/>
      <line x1="250" y1="211" x2="250" y2="234"/>
      <line x1="410" y1="209" x2="410" y2="186"/>
      <line x1="560" y1="211" x2="560" y2="234"/>
      <line x1="700" y1="209" x2="700" y2="186"/>
      <line x1="850" y1="211" x2="850" y2="234"/>
      <line x1="990" y1="209" x2="990" y2="186"/>
      <line x1="1120" y1="211" x2="1120" y2="234"/>
    </g>

    <circle cx="90" cy="210" r="5.5" fill="#0A0F16" stroke="#3FBFD4" stroke-width="2"/>
    <circle cx="250" cy="210" r="5.5" fill="#0A0F16" stroke="#9B7BF0" stroke-width="2"/>
    <circle cx="410" cy="210" r="5.5" fill="#E8A33D"/>
    <circle cx="560" cy="210" r="5.5" fill="#0A0F16" stroke="#9B7BF0" stroke-width="2"/>
    <circle cx="700" cy="210" r="5.5" fill="#0A0F16" stroke="#9B7BF0" stroke-width="2"/>
    <circle cx="850" cy="210" r="5.5" fill="#0A0F16" stroke="#9B7BF0" stroke-width="2"/>
    <circle cx="990" cy="210" r="5.5" fill="#E8A33D"/>
    <circle cx="1120" cy="210" r="5.5" fill="#0A0F16" stroke="#3FBFD4" stroke-width="2"/>

    <!-- labels above -->
    <g text-anchor="middle">
      <text class="mono d" x="90" y="152">2023</text>
      <text class="sans t" x="90" y="174">B.Tech begins</text>

      <text class="mono d" x="410" y="152">Jun – Jul 2025</text>
      <text class="sans t" x="410" y="174">AI intern, Mindenious</text>

      <text class="mono d" x="700" y="152">Oct 2025</text>
      <text class="sans t" x="700" y="174">AWS Cloud Practitioner</text>

      <text class="mono d" x="990" y="152">May – Jun 2026</text>
      <text class="sans t" x="990" y="174">MERN intern, CSC India</text>
    </g>

    <!-- labels below -->
    <g text-anchor="middle">
      <text class="mono d" x="250" y="254">Mar 2025</text>
      <text class="sans t" x="250" y="276">Cisco Python Essentials 1</text>
      <text class="mono d" x="250" y="296">Front-end development journey</text>

      <text class="mono d" x="560" y="254">Aug 2025</text>
      <text class="sans t" x="560" y="276">HackerRank Java (Basic)</text>

      <text class="mono d" x="850" y="254">Mar 2026</text>
      <text class="sans t" x="850" y="276">Infosys Java: Essentials</text>

      <text class="mono d" x="1112" y="254">2027</text>
      <text class="sans t" x="1112" y="276">Graduation</text>
    </g>

    <!-- legend -->
    <g>
      <circle cx="46" cy="322" r="4.5" fill="#0A0F16" stroke="#3FBFD4" stroke-width="2"/>
      <text class="mono" x="58" y="326" font-size="11.5" fill="#4E5B69">education</text>
      <circle cx="176" cy="322" r="4.5" fill="#E8A33D"/>
      <text class="mono" x="188" y="326" font-size="11.5" fill="#4E5B69">internship</text>
      <circle cx="310" cy="322" r="4.5" fill="#0A0F16" stroke="#9B7BF0" stroke-width="2"/>
      <text class="mono" x="322" y="326" font-size="11.5" fill="#4E5B69">certification</text>
      <text class="mono" x="1160" y="326" font-size="11.5" text-anchor="end" fill="#4E5B69">Intermediate 85% · SSC 83%</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="347" rx="16" fill="none" stroke="#1F2937"/>
  </g>
</svg>
