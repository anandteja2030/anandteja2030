.0 288.0,168.0" fill="url(#topc)" stroke="#22D3EE" stroke-linejoin="round" stroke-width="1.5"/></g><g class="float2"><polygon points="302.0,130.0 350.0,154.0 350.0,170.0 302.0,146.0" fill="#0D1A38" stroke="#5B6CF0" stroke-linejoin="round" stroke-width="1.2"/><polygon points="350.0,154.0 398.0,130.0 398.0,146.0 350.0,170.0" fill="#0A1229" stroke="#5B6CF0" stroke-linejoin="round" stroke-width="1.2"/><polygon points="350.0,106.0 398.0,130.0 350.0,154.0 302.0,130.0" fill="url(#topi)" stroke="#5B6CF0" stroke-linejoin="round" stroke-width="1.5"/></g><rect x="469" y="78" width="152" height="260" rx="20" fill="#02040A" opacity=".7"/><rect x="464" y="70" width="152" height="260" rx="20" fill="url(#pan)" stroke="#22324F" stroke-width="1.2"/><rect x="465" y="71" width="150" height="258" rx="19" fill="none" stroke="#fff" stroke-opacity=".04"/><rect x="484" y="70" width="112" height="1.8" fill="url(#edge)"/><text x="484" y="108" class="m" font-size="13" font-weight="700" fill="#6366F1" text-anchor="start" letter-spacing="2" opacity="1" >STRUCTURE</text><circle cx="540" cy="184" r="40" fill="#0A1324" stroke="#6366F1" stroke-width="1.6"/><circle cx="540" cy="184" r="52" fill="none" stroke="#6366F1" stroke-opacity=".4" stroke-dasharray="3 9" stroke-linecap="round" style="transform-origin:540px 184px;animation:spin 40s linear infinite"/><text x="540" y="196" class="m" font-size="32" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" opacity="1" >&lt;/&gt;</text><text x="540" y="288" class="m" font-size="19" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0" opacity="1" >HTML5</text><rect x="498" y="304" width="84" height="4" rx="2" fill="#6366F1" class="pulse" style="animation-delay:-0.0s"/><rect x="637" y="78" width="152" height="260" rx="20" fill="#02040A" opacity=".7"/><rect x="632" y="70" width="152" height="260" rx="20" fill="url(#pan)" stroke="#22324F" stroke-width="1.2"/><rect x="633" y="71" width="150" height="258" rx="19" fill="no