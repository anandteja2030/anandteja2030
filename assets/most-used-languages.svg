<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="ttl dsc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="ttl">Core development languages</title><desc id="dsc">Core languages: Java as the primary language, with HTML5, CSS3 and JavaScript. A presentation of the primary development stack, not a statistical breakdown of GitHub language usage.</desc><defs>
<radialGradient id="atm" cx="72%" cy="14%" r="90%"><stop offset="0" stop-color="#17264B"/><stop offset=".5" stop-color="#0A1226"/><stop offset="1" stop-color="#050810"/></radialGradient>
<linearGradient id="pan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16223C"/><stop offset="1" stop-color="#0A1120"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
<linearGradient id="acv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".95"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<linearGradient id="topc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity=".55"/><stop offset="1" stop-color="#6366F1" stop-opacity=".40"/></linearGradient>
<linearGradient id="topi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1" stop-opacity=".50"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".35"/></linearGradient>
<linearGradient id="topb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E3A6E" stop-opacity=".85"/><stop offset="1" stop-color="#151F45" stop-opacity=".85"/></linearGradient>
<linearGradient id="edu" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#6366F1" stop-opacity=".22"/></linearGradient>
<radialGradient id="shadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22D3EE" stop-opacity=".35"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#3A4E72" opacity=".32"/></pattern>
</defs><style>
.d{font-family:'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace}
@keyframes flow{to{stroke-dashoffset:-56}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(300px)}}
@keyframes gauge{0%{stroke-dashoffset:164}50%,90%{stroke-dashoffset:24}100%{stroke-dashoffset:164}}
@keyframes cmp{from{transform:translateX(0)}to{transform:translateX(506px)}}
@keyframes swA{0%,20%{transform:translateX(0)}40%,70%{transform:translateX(46px)}90%,100%{transform:translateX(0)}}
@keyframes swB{0%,20%{transform:translateX(0)}40%,70%{transform:translateX(-46px)}90%,100%{transform:translateX(0)}}
@keyframes knob{from{transform:translateX(0)}to{transform:translateX(46px)}}
@keyframes tab{0%,18%{opacity:1}24%,100%{opacity:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.flow{stroke-dasharray:5 9;animation:flow 2.6s linear infinite}
.flowr{stroke-dasharray:5 9;animation:flow 2.6s linear infinite reverse}
.pulse{animation:pulse 3s ease-in-out infinite}
.float{animation:float 8s ease-in-out infinite}
.float2{animation:float 8s ease-in-out -3s infinite}
.float3{animation:float 8s ease-in-out -5.5s infinite}
.scan{animation:scan 7s linear infinite}
.gauge{stroke-dasharray:164;stroke-dashoffset:24;animation:gauge 6s ease-out infinite}
.cmp{animation:cmp 7.7s steps(11,end) infinite}
.swA{animation:swA 6s ease-in-out infinite}
.swB{animation:swB 6s ease-in-out infinite}
.knob{animation:knob 5s ease-in-out infinite alternate}
.tab{opacity:0;animation:tab 10s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
