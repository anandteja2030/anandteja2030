<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368" role="img" aria-label="Technical stack: languages, web, AI and data, engineering practice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Technical stack</title>
  <defs>
    <pattern id="s-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141C26" stroke-width="1"/>
    </pattern>
    <clipPath id="s-clip"><rect x="0" y="0" width="1200" height="368" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#s-clip)">
    <rect width="1200" height="368" fill="#0A0F16"/>
    <rect width="1200" height="368" fill="url(#s-grid)" opacity="0.5"/>

    <text class="sans" x="40" y="48" font-size="19" font-weight="600" fill="#E3EAF2">Stack</text>
    <text class="mono" x="40" y="72" font-size="12.5" fill="#5D6B7A">what I actually build with, grouped by where it sits in the system</text>
    <line x1="40" y1="92" x2="1160" y2="92" stroke="#1B2431"/>

    <!-- column 1 -->
    <g>
      <rect x="40" y="112" width="262" height="224" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="40" y="112" width="262" height="3" rx="1.5" fill="#E8A33D"/>
      <text class="mono" x="60" y="146" font-size="12.5" letter-spacing="1.3" fill="#E8A33D">LANGUAGES</text>
      <g class="mono" font-size="13.5" fill="#C6D2DE">
        <text x="60" y="180">Java</text>
        <text x="60" y="210">Python</text>
        <text x="60" y="240">C</text>
        <text x="60" y="270">SQL</text>
      </g>
      <text class="mono" x="60" y="310" font-size="11.5" fill="#4E5B69">primary: Java, OOP-first</text>
    </g>

    <!-- column 2 -->
    <g>
      <rect x="320" y="112" width="262" height="224" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="320" y="112" width="262" height="3" rx="1.5" fill="#3FBFD4"/>
      <text class="mono" x="340" y="146" font-size="12.5" letter-spacing="1.3" fill="#3FBFD4">WEB</text>
      <g class="mono" font-size="13.5" fill="#C6D2DE">
        <text x="340" y="180">HTML5</text>
        <text x="340" y="210">CSS3</text>
        <text x="340" y="240">JavaScript</text>
        <text x="340" y="270">MERN workflow</text>
      </g>
      <text class="mono" x="340" y="310" font-size="11.5" fill="#4E5B69">frontend to database wiring</text>
    </g>

    <!-- column 3 -->
    <g>
      <rect x="600" y="112" width="278" height="224" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="600" y="112" width="278" height="3" rx="1.5" fill="#9B7BF0"/>
      <text class="mono" x="620" y="146" font-size="12.5" letter-spacing="1.3" fill="#9B7BF0">AI &amp; DATA</text>
      <g class="mono" font-size="13.5" fill="#C6D2DE">
        <text x="620" y="180">Scikit-learn</text>
        <text x="620" y="204">XGBoost</text>
        <text x="620" y="228">LightGBM</text>
        <text x="620" y="252">Sentence-BERT</text>
        <text x="620" y="276">TF-IDF</text>
        <text x="620" y="300">Pandas</text>
      </g>
      <text class="mono" x="620" y="324" font-size="11.5" fill="#4E5B69">Streamlit for delivery</text>
    </g>

    <!-- column 4 -->
    <g>
      <rect x="896" y="112" width="264" height="224" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="896" y="112" width="264" height="3" rx="1.5" fill="#5B9CF8"/>
      <text class="mono" x="916" y="146" font-size="12.5" letter-spacing="1.3" fill="#5B9CF8">PRACTICE</text>
      <g class="mono" font-size="13.5" fill="#C6D2DE">
        <text x="916" y="180">Data structures</text>
        <text x="916" y="204">Algorithms</text>
        <text x="916" y="228">Object-oriented design</text>
        <text x="916" y="252">Git and GitHub</text>
        <text x="916" y="276">VS Code</text>
      </g>
      <text class="mono" x="916" y="310" font-size="11.5" fill="#4E5B69">no percentages, just use</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="367" rx="16" fill="none" stroke="#1F2937"/>
  </g>
</svg>
