<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="228" viewBox="0 0 1200 228" role="img" aria-label="Achievements and leadership: hackathon second prize, national event coordinator, AWS workshop coordination, state-level chess" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Achievements and leadership</title>
  <defs>
    <pattern id="a-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141C26" stroke-width="1"/>
    </pattern>
    <clipPath id="a-clip"><rect x="0" y="0" width="1200" height="228" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#a-clip)">
    <rect width="1200" height="228" fill="#0A0F16"/>
    <rect width="1200" height="228" fill="url(#a-grid)" opacity="0.5"/>

    <text class="sans" x="40" y="44" font-size="19" font-weight="600" fill="#E3EAF2">Beyond the code</text>
    <line x1="40" y1="64" x2="1160" y2="64" stroke="#1B2431"/>

    <g>
      <rect x="40" y="88" width="265" height="106" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="40" y="88" width="3" height="106" rx="1.5" fill="#E8A33D"/>
      <text class="sans" x="62" y="122" font-size="15" font-weight="600" fill="#E3EAF2">2nd prize, hackathon</text>
      <text class="mono" x="62" y="148" font-size="12" fill="#94A3B2">built a MERN-stack</text>
      <text class="mono" x="62" y="168" font-size="12" fill="#94A3B2">web application</text>
    </g>

    <g>
      <rect x="325" y="88" width="265" height="106" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="325" y="88" width="3" height="106" rx="1.5" fill="#9B7BF0"/>
      <text class="sans" x="347" y="122" font-size="15" font-weight="600" fill="#E3EAF2">National coordinator</text>
      <text class="mono" x="347" y="148" font-size="12" fill="#94A3B2">Lakshya 2K25, LBRCE</text>
      <text class="mono" x="347" y="168" font-size="12" fill="#94A3B2">2024 – 2025</text>
    </g>

    <g>
      <rect x="610" y="88" width="265" height="106" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="610" y="88" width="3" height="106" rx="1.5" fill="#3FBFD4"/>
      <text class="sans" x="632" y="122" font-size="15" font-weight="600" fill="#E3EAF2">AWS workshops</text>
      <text class="mono" x="632" y="148" font-size="12" fill="#94A3B2">coordinated cloud</text>
      <text class="mono" x="632" y="168" font-size="12" fill="#94A3B2">sessions for classmates</text>
    </g>

    <g>
      <rect x="895" y="88" width="265" height="106" rx="10" fill="#0C121A" stroke="#1B2431"/>
      <rect x="895" y="88" width="3" height="106" rx="1.5" fill="#5B9CF8"/>
      <text class="sans" x="917" y="122" font-size="15" font-weight="600" fill="#E3EAF2">State-level chess</text>
      <text class="mono" x="917" y="148" font-size="12" fill="#94A3B2">tournament conducted</text>
      <text class="mono" x="917" y="168" font-size="12" fill="#94A3B2">by SGF</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="227" rx="16" fill="none" stroke="#1F2937"/>
  </g>
</svg>
